name = "paiwei-line-dashboard"
main = "src/worker.js"
compatibility_date = "2026-07-25"

[vars]
META_CONTENT_PAGE_ID = "107391404964329"
META_CONTENT_IG_USER_ID = "17841448491675947"

[[d1_databases]]
binding = "DB"
database_name = "paiwei-line-health-db"
database_id = "a7ce826e-a3b7-4076-8d9d-cc95a719824b"

# Cloudflare Variable:
# meta_ad_account_id
#
# Required Cloudflare Secret:
# META_ACCESS_TOKEN
# META_CONTENT_PAGE_ACCESS_TOKEN
# META_CONTENT_USER_ACCESS_TOKEN
# INSTAGRAM_ACCESS_TOKEN (legacy fallback; keep in Cloudflare Secret)
#
# Content Variables:
# META_CONTENT_PAGE_ID
# META_CONTENT_IG_USER_ID (optional)
# META_CONTENT_GRAPH_VERSION (optional; defaults to v26.0)
#
# Recommended security Secrets (must set both to enable dashboard login):
# DASHBOARD_PASSWORD
# COOKIE_SIGNING_KEY
