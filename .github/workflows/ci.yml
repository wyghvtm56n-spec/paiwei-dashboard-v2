name: Verify Dashboard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: JavaScript checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify
        run: npm run verify
